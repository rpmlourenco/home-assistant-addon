name: Music Assistant (rpmlourenco)
version: 2.10.1.dev3
slug: music_assistant_personal
description: Personal Music Assistant image built from the rpmlourenco/server fork.
url: https://github.com/rpmlourenco/server
arch:
  - aarch64
homeassistant_api: true
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: Music Assistant (personal)
panel_admin: false
uart: false
apparmor: true
map:
  - media:rw
  - ssl:ro
init: false
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
stage: experimental
image: ghcr.io/rpmlourenco/server
tmpfs: true
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
